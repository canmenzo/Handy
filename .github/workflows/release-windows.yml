name: "Release (Windows, unsigned)"

# Fork-only release path. Upstream's release.yml builds all seven platforms with
# sign-binaries: true, which needs Apple certificates and Azure Trusted Signing
# credentials this fork doesn't have — every signing step would fail. This builds
# the one platform the fork is actually used on and skips signing entirely, so it
# runs on a fork with no secrets configured.
#
# The result is a draft release: nothing becomes public until you publish it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for this release. Must not already exist — upstream's v0.9.x tags came along with the fork, so don't reuse the bare version."
        required: false
        type: string

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION=$(grep -o '"version": "[^"]*"' src-tauri/tauri.conf.json | cut -d'"' -f4)
            # Suffixed so it can't collide with the upstream tag of the same version.
            TAG="v${VERSION}-win.${{ github.run_number }}"
          fi
          echo "Release tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v9
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `${{ steps.tag.outputs.tag }}`,
              name: `${{ steps.tag.outputs.tag }} (Windows, unsigned)`,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
              body: [
                'Windows x64 build of this fork. **Unsigned** — SmartScreen will warn',
                'on first run; choose More info → Run anyway.',
                '',
                'Built by `.github/workflows/release-windows.yml`.',
              ].join('\n'),
            })
            return data.id

  build-windows:
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      platform: "windows-latest"
      target: "x86_64-pc-windows-msvc"
      sign-binaries: false
      asset-prefix: "handy-windows"
      upload-artifacts: false
      release-id: ${{ needs.create-release.outputs.release-id }}
      # Match upstream's release policy: build from scratch so a stale cached
      # native lib can never end up in a shipped artifact.
      no-cache: true
    secrets: inherit
